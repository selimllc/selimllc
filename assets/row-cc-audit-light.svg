<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 0 896 128" width="896" height="128" role="img" aria-labelledby="t">
<title id="t">01. cc-audit: Local, zero-telemetry audit layer for Claude Code. A PreToolUse hook blocks secret reads and exfil commands, then logs every call to JSONL.</title>
<style>
  .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Consolas, Menlo, monospace; font-size: 14px; }
  .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fg { fill: #1f1d1a; } .muted { fill: #6e6a62; } .accent { fill: #c13d17; }
  .rule { stroke: #d9d5cd; stroke-width: 1; }
  .draw { transform-box: fill-box; transform-origin: left center;
           animation: draw 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .grow { transform-box: fill-box; transform-origin: center bottom;
           animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
  .arrive { animation: arrive 1ms linear both; }
  .fade { animation: fade .6s ease-out both; }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  <text x="-4" y="76" class="sans muted arrive" style="font-size:68px;font-weight:200;letter-spacing:-.03em;animation-delay:0.4s">01</text>
  <text x="120" y="40" class="sans fg" style="font-size:22px;font-weight:600">cc-audit</text>
  <text x="880" y="40" class="mono muted" text-anchor="end" style="font-size:12px">Python  ·  MIT</text>
  <text y="70" class="sans muted" style="font-size:15px">
    <tspan x="120" dy="0">Local, zero-telemetry audit layer for Claude Code. A PreToolUse hook</tspan>
    <tspan x="120" dy="22">blocks secret reads and exfil commands, then logs every call to JSONL.</tspan>
