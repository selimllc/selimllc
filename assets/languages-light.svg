<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 0 896 122" width="896" height="122" role="img" aria-labelledby="t">
<title id="t">Languages across public repositories: PHP 73.9%, Python 18.4%, CSS 7.5%, Other 0.2%</title>
<style>
  .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', SFMono-Regular, Consolas, Menlo, monospace; font-size: 14px; }
  .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fg { fill: #1f1d1a; } .muted { fill: #6e6a62; } .accent { fill: #c13d17; }
  .rule { stroke: #d9d5cd; stroke-width: 1; }
  .draw { transform-box: fill-box; transform-origin: left center;
           animation: draw 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .grow { transform-box: fill-box; transform-origin: center bottom;
           animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
  .arrive { animation: arrive 1ms linear both; }
  .fade { animation: fade .6s ease-out both; }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
